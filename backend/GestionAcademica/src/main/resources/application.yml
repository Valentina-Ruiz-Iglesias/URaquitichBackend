server:
  port: 8083

spring:
  application:
    name: gestion-academica

  datasource:
    url: jdbc:postgresql://localhost:5435/db_academica
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      indent-output: true

app:
  jwt:
    secret: cmFxdWl0aWNoX3N1cGVyX3NlY3JldF9rZXlfand0XzIwMjZfcmFxdWl0aWNoX2JhY2tlbmQ=

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
