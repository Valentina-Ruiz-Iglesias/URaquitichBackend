server:
  port: 8082

spring:
  application:
    name: gestion-estudiantes

  datasource:
    url: jdbc:postgresql://localhost:6434/db_estudiantes
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      indent-output: true

app:
  jwt:
    # Misma clave que ServicioAutenticacion para validar los tokens JWT
    secret: cmFxdWl0aWNoX3N1cGVyX3NlY3JldF9rZXlfand0XzIwMjZfcmFxdWl0aWNoX2JhY2tlbmQ=
  auth-service:
    url: http://localhost:8081
    internal-api-key: raquitich-internal-secret-2026

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
