server:
  port: 8081

spring:
  application:
    name: servicio-autenticacion

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: bWlfY2xhdmVfc3VwZXJfc2VjcmV0YV9wYXJhX2p3dF9kZWJlX3Nlcl9sb25nYV95X2VuX2Jhc2U2NA==
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUGsuo