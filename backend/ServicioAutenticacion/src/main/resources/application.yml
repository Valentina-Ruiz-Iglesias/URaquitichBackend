server:
  port: 8081

spring:
  application:
    name: servicio-autenticacion

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: bWlfY2xhdmVfc3VwZXJfc2VjcmV0YV9wYXJhX2p3dF9kZWJlX3Nlcl9sb25nYV95X2VuX2Jhc2U2NA==
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG