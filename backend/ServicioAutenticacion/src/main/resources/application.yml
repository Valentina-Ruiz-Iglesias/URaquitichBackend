server:
  port: 8081

spring:
  application:
    name: servicio-autenticacion

  datasource:
    url: jdbc:postgresql://localhost:5433/db_autenticacion
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      indent-output: true

app:
  jwt:
    secret: raquitich_super_secret_key_jwt_2026_raquitich_backend
    expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE