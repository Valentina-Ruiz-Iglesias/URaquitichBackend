services:

  postgres-autenticacion:
    image: postgres:15-alpine
    container_name: postgres-autenticacion
    environment:
      POSTGRES_DB: db_autenticacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - pg_data_autenticacion:/var/lib/postgresql/data
    restart: always

  postgres-estudiantes:
    image: postgres:15-alpine
    container_name: postgres-estudiantes
    environment:
      POSTGRES_DB: db_estudiantes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - pg_data_estudiantes:/var/lib/postgresql/data
    restart: always

  postgres-academica:
    image: postgres:15-alpine
    container_name: postgres-academica
    environment:
      POSTGRES_DB: db_academica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5435:5432"
    volumes:
      - pg_data_academica:/var/lib/postgresql/data
    restart: always

  postgres-observaciones:
    image: postgres:15-alpine
    container_name: postgres-observaciones
    environment:
      POSTGRES_DB: db_observaciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5436:5432"
    volumes:
      - pg_data_observaciones:/var/lib/postgresql/data
    restart: always

  postgres-talleres:
    image: postgres:15-alpine
    container_name: postgres-talleres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talleres_db
    ports:
      - "5437:5432"
    volumes:
      - pg_data_talleres:/var/lib/postgresql/data
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-ui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@raquitich.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres-autenticacion
      - postgres-estudiantes
      - postgres-academica
      - postgres-observaciones
      - postgres-talleres
    restart: always

volumes:
  pg_data_autenticacion:
  pg_data_estudiantes:
  pg_data_academica:
  pg_data_observaciones:
  pg_data_talleres:
