services:
  # Base de datos PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-all
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - pg_data_persistence:/var/lib/postgresql/data
    restart: always

  # Interfaz gráfica para ver la base de datos
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-ui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@raquitich.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: always

volumes:
  pg_data_persistence:
